name: release-binaries

# Build per-platform binaries and attach them to the GitHub Release.
# Publisher auth = the workflow's GITHUB_TOKEN only (no npm, no 2FA).
# Consumers install via install.sh — zero auth.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build & attach assets to"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,      target: aarch64-apple-darwin }
          # Intel macs: cross-compiled on Apple silicon. The macos-13 (Intel)
          # runner image is retired; a job asking for it queues forever.
          - { os: macos-14,      target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run rebuilds the TAG it attaches to, not whatever main is now.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          BIN=chatgpt-use
          ASSET="$BIN-${{ matrix.target }}.tar.gz"
          tar -czf "$ASSET" -C "target/${{ matrix.target }}/release" "$BIN"
          if command -v sha256sum >/dev/null; then sha256sum "$ASSET" > "$ASSET.sha256"; else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256

  # Windows is this fork's reason for existing, and without a job here the
  # platform ships untested: the first Windows port compiled only because
  # nothing ever asked it to build on the platforms it broke.
  build-windows:
    name: x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # windows-latest ships VS with the C++ workload; assert it rather than
      # discovering a linker problem in a 4-minute build.
      - name: Check the MSVC linker is present
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found - no Visual Studio on this runner" }
          $hasLl = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $hasLl) { throw "no VC++ toolchain: $(& $vswhere -latest -products * -property displayName)" }
          Write-Host "linker from: $hasLl"

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        id: package
        shell: pwsh
        run: |
          $asset = "chatgpt-use-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path "target/x86_64-pc-windows-msvc/release/chatgpt-use.exe" -DestinationPath $asset
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          # `sha256sum`-style sidecar, matching the Unix assets so installers can
          # parse one format: "<hex>  <filename>".
          Set-Content -Path "$asset.sha256" -Value "$hash  $asset" -Encoding ascii -NoNewline
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
